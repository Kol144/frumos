name: Build Frumos Space for Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Generate app icon and splash resources
        run: npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor '#06130a' --splashBackgroundColor '#06130a'
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Package APK for download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/FrumosSpace.apk
          cd release && zip -j FrumosSpace-Android.zip FrumosSpace.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FrumosSpace-Android
          path: release/FrumosSpace-Android.zip
          if-no-files-found: error
      - name: Publish latest APK ZIP on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Frumos Space para Android" --notes "Descarga FrumosSpace-Android.zip e instala FrumosSpace.apk en tu dispositivo Android." --latest
          gh release upload android-latest release/FrumosSpace-Android.zip --clobber
